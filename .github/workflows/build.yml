name: Build llama.cpp with JoyFox JEV

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: JoyFox model revision
        required: true
        default: ae7b7040aeff7802f6f2bcfdd27f08a72d5cd969
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  MODEL_ID: joyfox/Qwen3.5-0.8B-JEV

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Install converter dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r llama.cpp/requirements.txt torch safetensors sentencepiece
          python -m pip install --upgrade 'transformers==5.5.3'

      - name: Build llama-server
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Compile llama-server
        run: cmake --build llama.cpp/build --target llama-server --parallel 2

      - name: Stage x86_64 server bundle
        run: |
          mkdir -p artifact/lib
          cp llama.cpp/build/bin/llama-server artifact/
          cp llama.cpp/build/bin/libllama-server-impl.so artifact/lib/
          for binary in artifact/llama-server artifact/lib/libllama-server-impl.so; do
            ldd "$binary" | awk '/=> \/.*\.so/ {print $3} /^\t\/.*\.so/ {print $1}' | while read -r library; do
              cp -n "$library" artifact/lib/
            done
          done
          LD_LIBRARY_PATH="$PWD/artifact/lib" artifact/llama-server --version

      - name: Upload x86_64 server bundle
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Download JoyFox checkpoint
        env:
          HF_ENDPOINT: https://huggingface.co
          MODEL_REVISION: ${{ inputs.model_revision || 'main' }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="joyfox/Qwen3.5-0.8B-JEV",
              revision=os.environ["MODEL_REVISION"],
              local_dir="model",
              allow_patterns=["decision_config.json", "head.safetensors", "backbone/*", "tokenizer/*"],
          )
          PY

      - name: Convert checkpoint to JEV GGUF
        run: |
          . .venv/bin/activate
          python llama.cpp/convert_hf_to_gguf.py model --outfile model-jev-f16.gguf --outtype f16

      - name: Run JEV endpoint smoke tests
        run: |
          set -euo pipefail
          llama.cpp/build/bin/llama-server --model model-jev-f16.gguf --host 127.0.0.1 --port 8080 --ctx-size 1024 --parallel 1 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          python tests/jev_smoke.py --base-url http://127.0.0.1:8080

  build-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build Android ARM64 libraries
        run: |
          cmake -S llama.cpp -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CONNECT=OFF \
            -DLLAMA_TOOLS_INSTALL=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/android-arm64"
          cmake --build build-android-arm64 --target install --parallel 2

      - name: Stage Android ARM64 libraries
        run: |
          mkdir -p artifact/lib
          find android-arm64 -type f -name '*.so*' -exec cp -L {} artifact/lib/ \;
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" artifact/lib/
          readelf -h artifact/lib/libllama.so | grep -E 'Class:|Machine:'
          test -f artifact/lib/libllama.so

      - name: Upload Android ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: llama-libs-android-arm64
          path: artifact/lib/
          if-no-files-found: error
          retention-days: 7

  build-flutter-linux-arm64:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: local_model_hub
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Flutter ARM64
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - name: Generate Linux runner
        run: flutter create --platforms=linux .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build Linux ARM64 application
        run: flutter build linux --release
      - name: Upload Flutter Linux ARM64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-linux-arm64
          path: local_model_hub/build/linux/arm64/release/bundle/
          if-no-files-found: error
          retention-days: 7

  build-flutter-android-arm64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: local_model_hub
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android .
      - name: Set Android compile SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          source, count = re.subn(
              r'flutter\.compileSdkVersion',
              '36',
              source,
          )
          if count != 1:
              raise SystemExit(f'Expected one Flutter compileSdk reference, found {count}')
          gradle.write_text(source)
          print('\n'.join(line for line in source.splitlines() if 'compileSdk' in line))
          PY
      - name: Configure Android Gradle DSL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          catalog = Path('android/gradle/libs.versions.toml')
          if catalog.exists():
              source = catalog.read_text()
              source, count = re.subn(
                  r'(?m)^agp\s*=\s*"[^"]+"',
                  'agp = "8.13.2"',
                  source,
              )
              if count != 1:
                  raise SystemExit(f'Expected one AGP version, found {count}')
              catalog.write_text(source)
          else:
              build = Path('android/settings.gradle.kts')
              source = build.read_text()
              source, count = re.subn(
                  r'(?m)(id\("com\.android\.application"\)\s+version\s+)"[^"]+"',
                  r'\g<1>"8.13.2"',
                  source,
              )
              if count != 1:
                  raise SystemExit(f'Expected one AGP plugin version, found {count}')
              build.write_text(source)
          properties = Path('android/gradle.properties')
          source = properties.read_text() if properties.exists() else ''
          source = re.sub(r'(?m)^android\.newDsl=.*\n?', '', source)
          properties.write_text(source)
          print('Pinned Android Gradle Plugin to 8.13.2; legacy Android DSL enabled')
          PY
          cat >> android/app/build.gradle.kts <<'EOF'

          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          tasks.withType<KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_11)
              }
          }
          EOF
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build Android ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-android-arm64-apk
          path: local_model_hub/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Build llama-server
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Compile llama-server
        run: cmake --build llama.cpp/build --target llama-server --parallel 2

      - name: Stage ARM64 server bundle
        run: |
          mkdir -p artifact/lib
          cp llama.cpp/build/bin/llama-server artifact/
          cp llama.cpp/build/bin/libllama-server-impl.so artifact/lib/
          for binary in artifact/llama-server artifact/lib/libllama-server-impl.so; do
            ldd "$binary" | awk '/=> \/.*\.so/ {print $3} /^\t\/.*\.so/ {print $1}' | while read -r library; do
              cp -n "$library" artifact/lib/
            done
          done
          LD_LIBRARY_PATH="$PWD/artifact/lib" artifact/llama-server --version

      - name: Upload ARM64 server bundle
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
