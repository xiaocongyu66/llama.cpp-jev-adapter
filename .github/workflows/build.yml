name: Build llama.cpp with JoyFox JEV

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: JoyFox model revision
        required: true
        default: ae7b7040aeff7802f6f2bcfdd27f08a72d5cd969
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  MODEL_ID: joyfox/Qwen3.5-0.8B-JEV

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Install converter dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r llama.cpp/requirements.txt torch safetensors sentencepiece
          python -m pip install --upgrade 'transformers==5.5.3'

      - name: Build llama-server
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Compile llama-server
        run: cmake --build llama.cpp/build --target llama-server --parallel 2

      - name: Stage x86_64 server bundle
        run: |
          mkdir -p artifact/lib
          cp llama.cpp/build/bin/llama-server artifact/
          cp llama.cpp/build/bin/libllama-server-impl.so artifact/lib/
          for binary in artifact/llama-server artifact/lib/libllama-server-impl.so; do
            ldd "$binary" | awk '/=> \/.*\.so/ {print $3} /^\t\/.*\.so/ {print $1}' | while read -r library; do
              cp -n "$library" artifact/lib/
            done
          done
          LD_LIBRARY_PATH="$PWD/artifact/lib" artifact/llama-server --version

      - name: Upload x86_64 server bundle
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Download JoyFox checkpoint
        env:
          HF_ENDPOINT: https://huggingface.co
          MODEL_REVISION: ${{ inputs.model_revision || 'main' }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="joyfox/Qwen3.5-0.8B-JEV",
              revision=os.environ["MODEL_REVISION"],
              local_dir="model",
              allow_patterns=["decision_config.json", "head.safetensors", "backbone/*", "tokenizer/*"],
          )
          PY

      - name: Convert checkpoint to JEV GGUF
        run: |
          . .venv/bin/activate
          python llama.cpp/convert_hf_to_gguf.py model --outfile model-jev-f16.gguf --outtype f16

      - name: Run JEV endpoint smoke tests
        run: |
          set -euo pipefail
          llama.cpp/build/bin/llama-server --model model-jev-f16.gguf --host 127.0.0.1 --port 8080 --ctx-size 1024 --parallel 1 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          python tests/jev_smoke.py --base-url http://127.0.0.1:8080

  build-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build Android ARM64 llama-server
        run: |
          cmake -S llama.cpp -B build-android-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_BORINGSSL=OFF \
            -DLLAMA_CONNECT=OFF \
            -DLLAMA_TOOLS_INSTALL=ON
          cmake --build build-android-arm64 --target llama-server --parallel 2
          mkdir -p artifact
          cp build-android-arm64/bin/llama-server artifact/libllama-server.so
          chmod 755 artifact/libllama-server.so
          readelf -h artifact/libllama-server.so | grep -E 'Class:|Machine:|Type:'
          test -x artifact/libllama-server.so

      - name: Upload Android ARM64 llama-server
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-android-arm64
          path: artifact/libllama-server.so
          if-no-files-found: error
          retention-days: 7

  build-compose-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build bundled Android ARM64 llama-server
        run: |
          cmake -S llama.cpp -B build-android-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF -DGGML_STATIC=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_BORINGSSL=OFF -DLLAMA_CONNECT=OFF -DLLAMA_TOOLS_INSTALL=ON
          cmake --build build-android-arm64 --target llama-server --parallel 2
          mkdir -p local_model_hub/composeApp/src/androidMain/jniLibs/arm64-v8a
          cp build-android-arm64/bin/llama-server local_model_hub/composeApp/src/androidMain/jniLibs/arm64-v8a/libllama-server.so
          chmod 755 local_model_hub/composeApp/src/androidMain/jniLibs/arm64-v8a/libllama-server.so
          readelf -h local_model_hub/composeApp/src/androidMain/jniLibs/arm64-v8a/libllama-server.so | grep -E 'Class:|Machine:|Type:'
      - name: Verify Gradle wrapper and analyze
        run: cd local_model_hub && ./gradlew --version && ./gradlew :composeApp:allTests :composeApp:lintDebug
      - name: Build Compose Android ARM64 APK
        run: cd local_model_hub && ./gradlew :composeApp:assembleRelease
      - name: Verify packaged Android server
        run: |
          python - <<'PY'
          import glob, struct, zipfile
          apks = glob.glob('local_model_hub/composeApp/build/outputs/apk/**/*.apk', recursive=True)
          if len(apks) != 1:
              raise SystemExit(f'Expected one APK, found {apks}')
          with zipfile.ZipFile(apks[0]) as archive:
              matches = [name for name in archive.namelist() if name.endswith('/libllama-server.so')]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one server, found {matches}')
              data = archive.read(matches[0])
              machine = struct.unpack_from('<H', data, 18)[0]
              if data[:4] != bytes.fromhex('7f454c46') or data[4] != 2 or machine != 183:
                  raise SystemExit(f'Unexpected packaged ELF {matches[0]}')
              print(f'{apks[0]} contains {matches[0]} (AArch64)')
          PY
      - name: Upload Compose Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-compose-android-arm64
          path: local_model_hub/composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  build-compose-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            server-build: build-linux-x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            server-build: build-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev rpm fakeroot
      - name: Build matching llama-server
        run: |
          cmake -S llama.cpp -B ${{ matrix.server-build }} -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build ${{ matrix.server-build }} --target llama-server --parallel 2
          mkdir -p local_model_hub/composeApp/src/desktopMain/resources/bin
          cp ${{ matrix.server-build }}/bin/llama-server local_model_hub/composeApp/src/desktopMain/resources/bin/llama-server
          chmod 755 local_model_hub/composeApp/src/desktopMain/resources/bin/llama-server
      - name: Test Compose desktop target
        run: cd local_model_hub && ./gradlew :composeApp:desktopTest :composeApp:compileKotlinDesktop
      - name: Build Compose Linux distribution
        run: cd local_model_hub && ./gradlew :composeApp:packageDistributionForCurrentOS
      - name: Upload Compose Linux ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-compose-linux-${{ matrix.arch }}
          path: local_model_hub/composeApp/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 7

  build-flutter-linux-arm64:
    if: ${{ false }}
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: local_model_hub
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Flutter ARM64
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - name: Generate Linux runner
        run: flutter create --platforms=linux .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build Linux ARM64 application
        run: flutter build linux --release
      - name: Upload Flutter Linux ARM64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-linux-arm64
          path: local_model_hub/build/linux/arm64/release/bundle/
          if-no-files-found: error
          retention-days: 7

  build-flutter-android-arm64:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: local_model_hub
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android .
      - name: Build bundled Android ARM64 llama-server
        run: |
          cmake -S ../llama.cpp -B ../build-android-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_BORINGSSL=OFF \
            -DLLAMA_CONNECT=OFF \
            -DLLAMA_TOOLS_INSTALL=ON
          cmake --build ../build-android-arm64 --target llama-server --parallel 2
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp ../build-android-arm64/bin/llama-server android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          readelf -h android/app/src/main/jniLibs/arm64-v8a/libllama-server.so | grep -E 'Class:|Machine:|Type:'
      - name: Configure Android engine service
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          android = Path('android/app/src/main')
          manifest = android / 'AndroidManifest.xml'
          source = manifest.read_text()
          source = source.replace(
              '<application',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n<application',
              1,
          )
          source = source.replace(
              '</application>',
              '<service android:name=".LlamaEngineService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Run local llama.cpp model inference" /></service>\n</application>',
              1,
          )
          manifest.write_text(source)

          kotlin = next(android.glob('kotlin/**/MainActivity.kt'))
          source = kotlin.read_text()
          package_match = re.search(r'(?m)^package (.+)$', source)
          if package_match is None:
              raise SystemExit('Flutter MainActivity package declaration missing')
          package = package_match.group(1)
          kotlin.write_text(f'''{package_match.group(0)}

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {{
              private lateinit var engineBridge: EngineBridge

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  engineBridge = EngineBridge(this)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "local_model_hub/engine").setMethodCallHandler(engineBridge)
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, "local_model_hub/engine_events").setStreamHandler(engineBridge)
              }}
          }}
          ''')
          implementation = Path('android-src/EngineBridge.kt')
          code = implementation.read_text().replace('package com.example.local_model_hub', f'package {package}')
          (kotlin.parent / 'EngineBridge.kt').write_text(code)
          if 'local_model_hub/engine_events' not in kotlin.read_text():
              raise SystemExit('Flutter engine channel registration failed')
          if '.LlamaEngineService' not in manifest.read_text():
              raise SystemExit('Foreground service manifest entry missing')
          PY
      - name: Set Android compile SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          source, count = re.subn(
              r'flutter\.compileSdkVersion',
              '36',
              source,
          )
          if count != 1:
              raise SystemExit(f'Expected one Flutter compileSdk reference, found {count}')
          gradle.write_text(source)
          print('\n'.join(line for line in source.splitlines() if 'compileSdk' in line))
          PY
      - name: Configure Android Gradle compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          properties = Path('android/gradle.properties')
          source = properties.read_text()
          source, count = re.subn(
              r'(?m)^android\.newDsl=.*$',
              'android.newDsl=false',
              source,
          )
          if count == 0:
              source += '\nandroid.newDsl=false\n'
          properties.write_text(source)
          print(next(line for line in source.splitlines() if line.startswith('android.newDsl=')))
          PY
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.findByName("android")?.let { android ->
                      val options = android.javaClass.getMethod("getCompileOptions").invoke(android)
                      options.javaClass.getMethod("setSourceCompatibility", JavaVersion::class.java)
                          .invoke(options, JavaVersion.VERSION_17)
                      options.javaClass.getMethod("setTargetCompatibility", JavaVersion::class.java)
                          .invoke(options, JavaVersion.VERSION_17)
                  }
              }
              tasks.withType<JavaCompile>().configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17.toString()
                  targetCompatibility = JavaVersion.VERSION_17.toString()
              }
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }
          EOF
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build Android ARM64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          python - <<'PY'
          import struct
          import zipfile

          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(apk) as archive:
              matches = [name for name in archive.namelist() if name.endswith('/libllama-server.so')]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one packaged llama-server, found {matches}')
              data = archive.read(matches[0])
              if data[:4] != bytes.fromhex('7f454c46'):
                  raise SystemExit(f'{matches[0]} is not an ELF file: {data[:16].hex()}')
              elf_class = data[4]
              byte_order = '<' if data[5] == 1 else '>'
              elf_type = struct.unpack_from(f'{byte_order}H', data, 16)[0]
              machine = struct.unpack_from(f'{byte_order}H', data, 18)[0]
              print(f'{matches[0]}: class={elf_class}, type={elf_type}, machine={machine}')
              if (elf_class, elf_type, machine) != (2, 3, 183):
                  raise SystemExit('APK server is not an AArch64 PIE executable')
          print('APK contains AArch64 PIE llama-server')
          PY
      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-android-arm64-apk
          path: local_model_hub/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Build llama-server
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Compile llama-server
        run: cmake --build llama.cpp/build --target llama-server --parallel 2

      - name: Stage ARM64 server bundle
        run: |
          mkdir -p artifact/lib
          cp llama.cpp/build/bin/llama-server artifact/
          cp llama.cpp/build/bin/libllama-server-impl.so artifact/lib/
          for binary in artifact/llama-server artifact/lib/libllama-server-impl.so; do
            ldd "$binary" | awk '/=> \/.*\.so/ {print $3} /^\t\/.*\.so/ {print $1}' | while read -r library; do
              cp -n "$library" artifact/lib/
            done
          done
          LD_LIBRARY_PATH="$PWD/artifact/lib" artifact/llama-server --version

      - name: Upload ARM64 server bundle
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
