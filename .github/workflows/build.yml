name: Build llama.cpp with JoyFox JEV

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: JoyFox model revision
        required: true
        default: ae7b7040aeff7802f6f2bcfdd27f08a72d5cd969
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  MODEL_ID: joyfox/Qwen3.5-0.8B-JEV

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Install converter dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r llama.cpp/requirements.txt torch safetensors sentencepiece
          python -m pip install --upgrade 'transformers==5.5.3'

      - name: Build llama-server
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Compile llama-server
        run: cmake --build llama.cpp/build --target llama-server --parallel 2

      - name: Stage x86_64 server bundle
        run: |
          mkdir -p artifact/lib
          cp llama.cpp/build/bin/llama-server artifact/
          cp llama.cpp/build/bin/libllama-server-impl.so artifact/lib/
          for binary in artifact/llama-server artifact/lib/libllama-server-impl.so; do
            ldd "$binary" | awk '/=> \/.*\.so/ {print $3} /^\t\/.*\.so/ {print $1}' | while read -r library; do
              cp -n "$library" artifact/lib/
            done
          done
          LD_LIBRARY_PATH="$PWD/artifact/lib" artifact/llama-server --version

      - name: Upload x86_64 server bundle
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Download JoyFox checkpoint
        env:
          HF_ENDPOINT: https://huggingface.co
          MODEL_REVISION: ${{ inputs.model_revision || 'main' }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="joyfox/Qwen3.5-0.8B-JEV",
              revision=os.environ["MODEL_REVISION"],
              local_dir="model",
              allow_patterns=["decision_config.json", "head.safetensors", "backbone/*", "tokenizer/*"],
          )
          PY

      - name: Convert checkpoint to JEV GGUF
        run: |
          . .venv/bin/activate
          python llama.cpp/convert_hf_to_gguf.py model --outfile model-jev-f16.gguf --outtype f16

      - name: Run JEV endpoint smoke tests
        run: |
          set -euo pipefail
          llama.cpp/build/bin/llama-server --model model-jev-f16.gguf --host 127.0.0.1 --port 8080 --ctx-size 1024 --parallel 1 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          python tests/jev_smoke.py --base-url http://127.0.0.1:8080

  build-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build Android ARM64 llama-server
        run: |
          cmake -S llama.cpp -B build-android-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_BORINGSSL=OFF \
            -DLLAMA_CONNECT=OFF \
            -DLLAMA_TOOLS_INSTALL=ON
          cmake --build build-android-arm64 --target llama-server --parallel 2
          mkdir -p artifact
          cp build-android-arm64/bin/llama-server artifact/libllama-server.so
          chmod 755 artifact/libllama-server.so
          readelf -h artifact/libllama-server.so | grep -E 'Class:|Machine:|Type:'
          test -x artifact/libllama-server.so

      - name: Upload Android ARM64 llama-server
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-android-arm64
          path: artifact/llama-server
          if-no-files-found: error
          retention-days: 7

  build-flutter-linux-arm64:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: local_model_hub
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Flutter ARM64
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - name: Generate Linux runner
        run: flutter create --platforms=linux .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build Linux ARM64 application
        run: flutter build linux --release
      - name: Upload Flutter Linux ARM64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-linux-arm64
          path: local_model_hub/build/linux/arm64/release/bundle/
          if-no-files-found: error
          retention-days: 7

  build-flutter-android-arm64:
    needs: build-android-arm64
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: local_model_hub
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android .
      - name: Download built-in llama-server
        uses: actions/download-artifact@v4
        with:
          name: llama-server-android-arm64
          path: artifact/android-server
      - name: Stage executable Android library
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          server="$(find artifact/android-server -type f -name '*.so' -print -quit)"
          test -n "$server"
          cp "$server" android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
      - name: Configure Android engine service
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          android = Path('android/app/src/main')
          manifest = android / 'AndroidManifest.xml'
          source = manifest.read_text()
          source = source.replace(
              '<application',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n<application',
              1,
          )
          source = source.replace(
              '</application>',
              '<service android:name=".LlamaEngineService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Run local llama.cpp model inference" /></service>\n</application>',
              1,
          )
          manifest.write_text(source)

          kotlin = next(android.glob('kotlin/**/MainActivity.kt'))
          source = kotlin.read_text()
          package = re.search(r'(?m)^package (.+)$', source).group(1)
          source = source.replace(
              'import io.flutter.embedding.android.FlutterActivity',
              'import io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\nimport io.flutter.plugin.common.EventChannel\nimport io.flutter.plugin.common.MethodChannel',
          )
          source = source.replace(
              'class MainActivity : FlutterActivity() {',
              '''class MainActivity : FlutterActivity() {
              private lateinit var engineBridge: EngineBridge

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  engineBridge = EngineBridge(this)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "local_model_hub/engine").setMethodCallHandler(engineBridge)
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, "local_model_hub/engine_events").setStreamHandler(engineBridge)
              }
          ''',
          )
          kotlin.write_text(source)
          implementation = Path('android-src/EngineBridge.kt')
          code = implementation.read_text().replace('package com.example.local_model_hub', f'package {package}')
          (kotlin.parent / 'EngineBridge.kt').write_text(code)
          if 'local_model_hub/engine_events' not in kotlin.read_text():
              raise SystemExit('Flutter engine channel registration failed')
          if '.LlamaEngineService' not in manifest.read_text():
              raise SystemExit('Foreground service manifest entry missing')
          PY
      - name: Set Android compile SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          source, count = re.subn(
              r'flutter\.compileSdkVersion',
              '36',
              source,
          )
          if count != 1:
              raise SystemExit(f'Expected one Flutter compileSdk reference, found {count}')
          gradle.write_text(source)
          print('\n'.join(line for line in source.splitlines() if 'compileSdk' in line))
          PY
      - name: Configure Android Gradle compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          properties = Path('android/gradle.properties')
          source = properties.read_text()
          source, count = re.subn(
              r'(?m)^android\.newDsl=.*$',
              'android.newDsl=false',
              source,
          )
          if count == 0:
              source += '\nandroid.newDsl=false\n'
          properties.write_text(source)
          print(next(line for line in source.splitlines() if line.startswith('android.newDsl=')))
          PY
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.findByName("android")?.let { android ->
                      val options = android.javaClass.getMethod("getCompileOptions").invoke(android)
                      options.javaClass.getMethod("setSourceCompatibility", JavaVersion::class.java)
                          .invoke(options, JavaVersion.VERSION_17)
                      options.javaClass.getMethod("setTargetCompatibility", JavaVersion::class.java)
                          .invoke(options, JavaVersion.VERSION_17)
                  }
              }
              tasks.withType<JavaCompile>().configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17.toString()
                  targetCompatibility = JavaVersion.VERSION_17.toString()
              }
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }
          EOF
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build Android ARM64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          python - <<'PY'
          import zipfile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(apk) as archive:
              name = 'lib/arm64-v8a/libllama-server.so'
              data = archive.read(name)
              if data[:4] != b'\\x7fELF' or data[18:20] != b'\\xb7\\x00':
                  raise SystemExit('APK server is not an ARM64 ELF executable')
              if data[16:18] != b'\\x03\\x00':
                  raise SystemExit('APK server is not a PIE executable')
          print('APK contains ARM64 PIE llama-server')
          PY
      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: local-model-hub-android-arm64-apk
          path: local_model_hub/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Build llama-server
        run: cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Compile llama-server
        run: cmake --build llama.cpp/build --target llama-server --parallel 2

      - name: Stage ARM64 server bundle
        run: |
          mkdir -p artifact/lib
          cp llama.cpp/build/bin/llama-server artifact/
          cp llama.cpp/build/bin/libllama-server-impl.so artifact/lib/
          for binary in artifact/llama-server artifact/lib/libllama-server-impl.so; do
            ldd "$binary" | awk '/=> \/.*\.so/ {print $3} /^\t\/.*\.so/ {print $1}' | while read -r library; do
              cp -n "$library" artifact/lib/
            done
          done
          LD_LIBRARY_PATH="$PWD/artifact/lib" artifact/llama-server --version

      - name: Upload ARM64 server bundle
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
